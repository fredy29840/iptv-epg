name: EPG

on:
  schedule:
    - cron: "17 3 * * *"   # tous les jours, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Fusion
        env:
          IPTV_HOST: ${{ secrets.IPTV_HOST }}
          IPTV_USER: ${{ secrets.IPTV_USER }}
          IPTV_PASS: ${{ secrets.IPTV_PASS }}
        run: |
          mkdir -p public
          python3 merge.py --out public/epg.xml.gz --stats stats.json

      # Un fichier presque vide ne doit pas remplacer celui de la veille.
      - name: Garde-fou
        run: |
          python3 - <<'EOF'
          import json, sys
          s = json.load(open("stats.json"))
          print(json.dumps(s, ensure_ascii=False, indent=1))
          if s["programmes"] < 25000:
              sys.exit(f"seulement {s['programmes']} programmes : publication annulée")
          EOF
          cp stats.json public/stats.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v5

      # Garde l'historique, et évite la désactivation du cron après 60 jours sans commit.
      - name: Historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "stats $(date -u +%F)"
          git push
