name: EPG

on:
  schedule:
    - cron: "17 3,9,15,21 * * *"   # 4 fois par jour : les noms des créneaux d'événement changent en journée
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Fusion
        env:
          IPTV_HOST: ${{ secrets.IPTV_HOST }}
          IPTV_USER: ${{ secrets.IPTV_USER }}
          IPTV_PASS: ${{ secrets.IPTV_PASS }}
        run: |
          mkdir -p public
          python3 merge.py --out public/epg.xml.gz --stats stats.json

      # Un fichier presque vide ne doit pas remplacer celui de la veille.
      - name: Garde-fou
        run: |
          python3 - <<'EOF'
          import json, sys
          s = json.load(open("stats.json"))
          print(json.dumps(s, ensure_ascii=False, indent=1))
          if s["programmes"] < 25000:
              sys.exit(f"seulement {s['programmes']} programmes : publication annulée")
          EOF
          cp stats.json public/stats.json

      # Deuxième ligne (Rapido) : guide séparé dans public/rapido/, chargé seulement par le
      # profil Rapido de l'appli. Panel parfois instable : un échec ne bloque pas la ligne
      # principale, et on republie alors le guide Rapido précédent.
      - name: Fusion Rapido
        id: rapido
        continue-on-error: true
        env:
          IPTV_HOST: ${{ secrets.RAPIDO_HOST }}
          IPTV_USER: ${{ secrets.RAPIDO_USER }}
          IPTV_PASS: ${{ secrets.RAPIDO_PASS }}
        run: |
          mkdir -p public/rapido
          python3 merge.py --out public/rapido/epg.xml.gz --stats stats-rapido.json
          python3 - <<'EOF'
          import json, sys
          s = json.load(open("stats-rapido.json"))
          print(json.dumps(s, ensure_ascii=False, indent=1))
          if s["programmes"] < 10000:
              sys.exit(f"Rapido : seulement {s['programmes']} programmes")
          EOF
          cp stats-rapido.json public/rapido/stats.json

      - name: Repli Rapido
        if: steps.rapido.outcome != 'success'
        run: |
          rm -rf public/rapido && mkdir -p public/rapido
          for f in epg.xml.gz epg-am.xml.gz epg-vip.xml.gz stats.json; do
            curl -fsSL -o "public/rapido/$f" "https://fredy29840.github.io/iptv-epg/rapido/$f" || rm -f "public/rapido/$f"
          done
          ls -la public/rapido

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v5

      # Garde l'historique, et évite la désactivation du cron après 60 jours sans commit.
      - name: Historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          [ -f stats-rapido.json ] && git add stats-rapido.json || true
          git diff --cached --quiet || git commit -m "stats $(date -u +%F)"
          git push
